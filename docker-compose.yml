services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    environment:
      MINIO_KEY: admin
      MINIO_SECRET: password123
      MINIO_BUCKET: bookflix
      MINIO_ENDPOINT: http://minio:9000

    restart: unless-stopped

    working_dir: /var/www

    volumes:
      - ./:/var/www

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

      minio:
        condition: service_started

    networks:
      - bookflix

  nginx:
    image: nginx:latest

    restart: unless-stopped

    ports:
      - "8000:80"

    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    networks:
      - bookflix

  mysql:
    image: mysql:8

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: bookflix
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_USER: bookflix

    ports:
      - "3306:3306"

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - bookflix

  redis:
    image: redis:7-alpine

    restart: unless-stopped

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      - bookflix

  minio:
    image: minio/minio

    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    networks:
      - bookflix

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    working_dir: /var/www

    volumes:
      - ./:/var/www

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

      minio:
        condition: service_started

    command: php artisan horizon

    restart: unless-stopped

    networks:
      - bookflix  

volumes:
  mysql_data:
  minio_data:

networks:
  bookflix: